image:
  repository: ghcr.io/rdlucas2/jobregator-worker
  tag: latest

service:
  port: 8080

probesEnabled: false

env:
  - name: NATS_URL
    value: "nats://nats:4222"
  - name: POSTGRES_DSN
    valueFrom:
      secretKeyRef:
        name: jobregator-secrets
        key: POSTGRES_DSN
  - name: ENABLE_ENRICHMENT
    value: "true"
  - name: MCP_SERVER_CMD
    value: "python"
  - name: MCP_SERVER_ARGS
    value: "-m src.server"
  - name: MCP_SERVER_WORKDIR
    value: "/mcp-server"
  - name: PROFILE_PATH
    value: "/config/profile.yaml"
  - name: ANTHROPIC_API_KEY
    valueFrom:
      secretKeyRef:
        name: jobregator-secrets
        key: ANTHROPIC_API_KEY
  - name: CLAUDE_MODEL
    value: "claude-opus-5"
  # Which model answers the bounded questions. "claude" while TypeSafe signups
  # are closed; switch to "jev" once TYPESAFE_API_KEY is populated.
  - name: ENRICHMENT_TYPED_PROVIDER
    value: "claude"
  - name: TYPESAFE_API_KEY
    valueFrom:
      secretKeyRef:
        name: jobregator-secrets
        key: TYPESAFE_API_KEY
        # Optional so selecting the claude provider does not wedge the pod in
        # CreateContainerConfigError; the app fails fast with a clearer message.
        optional: true
  - name: JEV_MODEL
    value: "jev-1.13.0"

volumes:
  - name: config
    configMap:
      name: jobregator-profile

volumeMounts:
  - name: config
    mountPath: /config
    readOnly: true
